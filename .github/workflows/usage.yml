# Deploys the usage collector (usage/) with a config generated from your PRIVATE registry.
# Repository variable: REGISTRY_REPO (owner/name of the private repo holding clients.yaml).
# Secrets: REGISTRY_TOKEN (fine-grained, Contents: Read on REGISTRY_REPO only),
#          CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + D1: Edit on the account the tools run in), CLOUDFLARE_ACCOUNT_ID,
#          USAGE_CF_API_TOKEN (Account Analytics: Read on every client account), TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#          PROVIDER_TOKENS (optional: JSON {"KEY": "token"} for the registry's usage.* blocks — GitHub/Resend/Supabase/Vercel).
name: Deploy usage collector
on:
  push:
    branches: [main]
    paths: ["usage/**", "scripts/**", ".github/workflows/usage.yml"]
  repository_dispatch:
    types: [registry-updated]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-usage
  cancel-in-progress: false
jobs:
  # Skip (not fail) until configured — see docs/SETUP.md. Forks without the secrets skip too.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R: ${{ secrets.REGISTRY_TOKEN }}
          REPO: ${{ vars.REGISTRY_REPO }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ] && [ -n "$R" ] && [ -n "$REPO" ]; then echo ready=true >> "$GITHUB_OUTPUT"
          else echo "::notice::Deploy skipped: set REGISTRY_REPO, REGISTRY_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (docs/SETUP.md)"; fi
  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out the private registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.REGISTRY_REPO }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          path: private
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Generate configs from the registry (they exist only inside this run)
        run: pnpm install --frozen-lockfile && node scripts/sync.mjs --registry private/clients.yaml
      - name: Install collector
        working-directory: usage
        run: pnpm install --frozen-lockfile
      - name: Ensure D1 database exists and inject its id
        working-directory: usage
        run: |
          set -euo pipefail
          NAME=max-free-tier-usage
          ID="$(pnpm exec wrangler d1 list --json | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid' | head -1)"
          if [ -z "$ID" ]; then
            pnpm exec wrangler d1 create "$NAME"
            ID="$(pnpm exec wrangler d1 list --json | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid' | head -1)"
          fi
          [ -n "$ID" ] || { echo "::error::could not resolve D1 id"; exit 1; }
          sed -i "s/__USAGE_D1_ID__/$ID/" wrangler.generated.jsonc
      - name: Migrate + deploy
        working-directory: usage
        run: |
          pnpm exec wrangler d1 migrations apply USAGE --remote --config wrangler.generated.jsonc
          pnpm exec wrangler deploy --config wrangler.generated.jsonc
      - name: Worker secrets (only the ones that are set)
        working-directory: usage
        env:
          CF_API_TOKEN: ${{ secrets.USAGE_CF_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROVIDER_TOKENS: ${{ secrets.PROVIDER_TOKENS }}
        run: |
          for s in CF_API_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PROVIDER_TOKENS; do
            if [ -n "${!s}" ]; then printf '%s' "${!s}" | pnpm exec wrangler secret put "$s" --config wrangler.generated.jsonc; else echo "skip $s (not set)"; fi
          done

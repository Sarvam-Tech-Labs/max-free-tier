# Deploys FlareWatch's monitor engine (uptime/services/worker) with monitors generated from your PRIVATE registry. It runs
# headless: the status-page app is NOT deployed, because the usage site is the one place to look (it reads the engine through a
# service binding). Alerts still go to Telegram.
# Adapted from uptime/.github/workflows/deploy.yml (upstream), run from the uptime/ folder. Upstream's quality job is
# not repeated: its badge tests hard-code the demo monitor ids (see docs/UPSTREAM.md).
#
# REUSABLE: called from YOUR PRIVATE registry repo (see docs/SETUP.md), never run here. Wrangler prints the generated
# config (client names, account ids) to the log, and Actions logs of a public repo are public — a called workflow runs
# and logs in the caller's (private) repo.
# Caller secrets (secrets: inherit): CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Account Settings: Read, User Details: Read,
# Memberships: Read), CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (alerts), optional HEARTBEAT_SECRET.
name: Deploy uptime monitor
on:
  workflow_call:
    inputs:
      tool-repository:
        description: This tool's repo (change it if you deploy from a fork)
        type: string
        default: Sarvam-Tech-Labs/max-free-tier
      tool-ref:
        type: string
        default: main
      registry:
        description: Registry path inside the calling repo
        type: string
        default: clients.yaml
permissions:
  contents: read
concurrency:
  group: deploy-uptime
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo ready=true >> "$GITHUB_OUTPUT"
          else echo "::notice::Deploy skipped: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the registry repo (docs/SETUP.md)"; fi
  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: uptime
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool-repository }}
          ref: ${{ inputs.tool-ref }}
          persist-credentials: false
      - name: Check out the calling (private) registry repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: private
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Generate monitors from the registry (they exist only inside this run)
        working-directory: .
        run: pnpm install --frozen-lockfile && node scripts/sync.mjs --registry "private/${{ inputs.registry }}"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: uptime
          node-version: '24'
          cache: true
          run-install: true

      - name: Deploy with Wrangler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT_SECRET: ${{ secrets.HEARTBEAT_SECRET }}
        run: |
          set -euo pipefail
          # One Telegram setup for every tool: build FlareWatch's webhook list from the shared TELEGRAM_* secrets.
          FLAREWATCH_WEBHOOKS=""
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            FLAREWATCH_WEBHOOKS="$(jq -cn --arg t "$TELEGRAM_BOT_TOKEN" --arg c "$TELEGRAM_CHAT_ID" \
              '[{url: ("https://api.telegram.org/bot" + $t + "/sendMessage?chat_id=" + $c), template: "telegram"}]')"
          fi
          put_secret() {
            [ -z "$4" ] && { echo "skip $3 (not set)"; return 0; }
            printf '%s' "$4" | vp exec --filter "$1" -- wrangler secret put "$3" --config "$2"
          }
          vp exec --filter worker -- wrangler deploy --config wrangler.toml
          put_secret worker wrangler.toml HEARTBEAT_SECRET "${HEARTBEAT_SECRET:-}"
          put_secret worker wrangler.toml FLAREWATCH_WEBHOOKS "$FLAREWATCH_WEBHOOKS"
          echo "### Uptime engine deployed (headless). Look at it on the usage site: Consumption → an email → Status." >> "$GITHUB_STEP_SUMMARY"

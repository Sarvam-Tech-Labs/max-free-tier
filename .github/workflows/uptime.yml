# Deploys FlareWatch (uptime/) with monitors generated from your PRIVATE registry.
# Adapted from uptime/.github/workflows/deploy.yml (upstream), run from the uptime/ folder. Upstream's quality job is
# not repeated: its badge tests hard-code the demo monitor ids (see docs/UPSTREAM.md).
#
# REUSABLE: called from YOUR PRIVATE registry repo (see docs/SETUP.md), never run here. Wrangler prints the generated
# config (client names, account ids) to the log, and Actions logs of a public repo are public — a called workflow runs
# and logs in the caller's (private) repo.
# Caller secrets (secrets: inherit): CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Workers KV Storage: Edit, Account
# Settings: Read, User Details: Read, Memberships: Read), CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
# (alerts), FLAREWATCH_ADMIN_BASIC_AUTH (status page sign-in), optional HEARTBEAT_SECRET.
name: Deploy uptime monitor
on:
  workflow_call:
    inputs:
      tool-repository:
        description: This tool's repo (change it if you deploy from a fork)
        type: string
        default: Sarvam-Tech-Labs/max-free-tier
      tool-ref:
        type: string
        default: main
      registry:
        description: Registry path inside the calling repo
        type: string
        default: clients.yaml
permissions:
  contents: read
concurrency:
  group: deploy-uptime
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo ready=true >> "$GITHUB_OUTPUT"
          else echo "::notice::Deploy skipped: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the registry repo (docs/SETUP.md)"; fi
  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: uptime
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool-repository }}
          ref: ${{ inputs.tool-ref }}
          persist-credentials: false
      - name: Check out the calling (private) registry repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: private
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Generate monitors from the registry (they exist only inside this run)
        working-directory: .
        run: pnpm install --frozen-lockfile && node scripts/sync.mjs --registry "private/${{ inputs.registry }}"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: uptime
          node-version: '24'
          cache: true
          run-install: true

      - name: Ensure KV namespace exists
        run: |
          set -euo pipefail
          KV_NAMESPACE_TITLE="flarewatch-state"
          find_namespace_id() {
            vp exec --filter worker -- wrangler kv namespace list \
              | jq -r --arg title "$KV_NAMESPACE_TITLE" 'map(select(.title == $title)) | .[0].id // empty'
          }
          KV_NAMESPACE_ID="$(find_namespace_id)"
          if [ -z "$KV_NAMESPACE_ID" ]; then
            vp exec --filter worker -- wrangler kv namespace create "$KV_NAMESPACE_TITLE" || true
            KV_NAMESPACE_ID="$(find_namespace_id)"
          fi
          [ -n "$KV_NAMESPACE_ID" ] || { echo "::error::could not resolve KV namespace id"; exit 1; }
          echo "KV_NAMESPACE_ID=$KV_NAMESPACE_ID" >> "$GITHUB_ENV"

      - name: Inject KV namespace id
        run: |
          set -euo pipefail
          sed -i "s/__FLAREWATCH_STATE_KV_NAMESPACE_ID__/$KV_NAMESPACE_ID/g" apps/status-page/wrangler.jsonc
          ! grep -q "__FLAREWATCH_STATE_KV_NAMESPACE_ID__" apps/status-page/wrangler.jsonc

      - name: Deploy with Wrangler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FLAREWATCH_ADMIN_BASIC_AUTH: ${{ secrets.FLAREWATCH_ADMIN_BASIC_AUTH }}
          FLAREWATCH_AUTH_SECRET: ${{ secrets.FLAREWATCH_AUTH_SECRET }}
          FLAREWATCH_OIDC_SECRETS: ${{ secrets.FLAREWATCH_OIDC_SECRETS }}
          HEARTBEAT_SECRET: ${{ secrets.HEARTBEAT_SECRET }}
        run: |
          set -euo pipefail
          # One Telegram setup for every tool: build FlareWatch's webhook list from the shared TELEGRAM_* secrets.
          FLAREWATCH_WEBHOOKS=""
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            FLAREWATCH_WEBHOOKS="$(jq -cn --arg t "$TELEGRAM_BOT_TOKEN" --arg c "$TELEGRAM_CHAT_ID" \
              '[{url: ("https://api.telegram.org/bot" + $t + "/sendMessage?chat_id=" + $c), template: "telegram"}]')"
          fi
          put_secret() {
            [ -z "$4" ] && { echo "skip $3 (not set)"; return 0; }
            printf '%s' "$4" | vp exec --filter "$1" -- wrangler secret put "$3" --config "$2"
          }
          vp exec --filter worker -- wrangler deploy --config wrangler.toml
          put_secret worker wrangler.toml HEARTBEAT_SECRET "${HEARTBEAT_SECRET:-}"
          put_secret worker wrangler.toml FLAREWATCH_WEBHOOKS "$FLAREWATCH_WEBHOOKS"
          vp run --filter status-page build
          vp exec --filter status-page -- wrangler deploy --config dist/server/wrangler.json | tee "$RUNNER_TEMP/status.log"
          put_secret status-page dist/server/wrangler.json FLAREWATCH_ADMIN_BASIC_AUTH "${FLAREWATCH_ADMIN_BASIC_AUTH:-}"
          put_secret status-page dist/server/wrangler.json FLAREWATCH_AUTH_SECRET "${FLAREWATCH_AUTH_SECRET:-}"
          put_secret status-page dist/server/wrangler.json FLAREWATCH_OIDC_SECRETS "${FLAREWATCH_OIDC_SECRETS:-}"
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' "$RUNNER_TEMP/status.log" | tail -n1 || true)"
          echo "### FlareWatch deployed — status page: ${URL:-see the Cloudflare dashboard}" >> "$GITHUB_STEP_SUMMARY"

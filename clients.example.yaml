# Example client registry. The REAL one is private: keep it in a separate private repo
# (e.g. your-org/max-free-tier-clients) whose deploy workflow calls this repo's reusable workflows — they generate configs from it, so
# client names, account ids and domains never land in this public repo.
#
# Validate this file:  node scripts/sync.mjs --registry clients.example.yaml --dry-run
#
# email: the client's email. It identifies them on the overview page (search /clients by email). Several clients may share one email (an owner with several sites).
# status: live = monitored and on alerts · unconfirmed = recorded so it is findable, not monitored · paused = keep the
#         record, stop monitoring.
# cloudflare.account_id: the client's own account (your team is a member). The usage collector reads every listed
#         account with ONE Account Analytics: Read token.
# domains: registrable domains; FlareWatch checks their registration (RDAP) daily and warns 30 days before expiry.
# monitors: HTTP checks every minute. keyword = text the page must contain (catches "200 but broken");
#         expect = accepted status codes (default [200]).
# usage: free-plan checks on other platforms, hourly, alerts at the same 50/80/95% levels. `token` is the NAME of a key
#         in the PROVIDER_TOKENS secret (JSON {"GH_ACME": "github_pat_…"}), never the token itself.
#         github:   Actions minutes vs 2,000/month. account = user or org login (org: true). Fine-grained PAT created BY
#                   that account, permission Plan: read (orgs: Administration: read). No repository access needed.
#         resend:   every quota (emails/day, emails/month, domains, contacts…) with Resend's own limits. Resend has no
#                   read-only key: create a full-access key used only for this.
#         supabase: per project ref: paused / unhealthy alert, database size vs 500 MB, file storage vs 1 GB. Scoped PAT
#                   with projects_read + database_read; one token can cover every org your team belongs to.
#         vercel:   alert when Vercel blocks the team for exceeding Hobby limits. account = team id (team_…).
#                   Team-scoped token. (Hobby exposes no usage numbers to tokens.)
# local: where the project lives on the team's machine (optional; used by the runbook in CLAUDE.md).
# No secrets in a registry — tokens live in GitHub Actions secrets / Worker secrets.

# Optional: names the status page and the overview page, and sets the time zone used in alert messages.
# watchdog: a dead-man's-switch URL OUTSIDE Cloudflare (e.g. a free Healthchecks.io check, period 1 min, grace 5 min)
#           that FlareWatch requests every minute. When FlareWatch or Cloudflare goes down the requests stop and that
#           service alerts you — the one failure FlareWatch cannot report itself.
org:
  name: Acme Agency
  url: https://acme-agency.example
  timeZone: Asia/Kolkata
  watchdog: https://hc-ping.com/00000000-0000-0000-0000-000000000000

clients:
  - id: acme
    name: Acme Books
    email: owner@acme.example # identifies the client on the overview page (/clients, searchable); unique, optional
    status: live
    platforms: [cloudflare-workers, cloudflare-pages, d1, r2, resend]
    cloudflare:
      account_id: 0123456789abcdef0123456789abcdef
    github: [acme/acme-web]
    local: acme-web
    domains: [acme.example]
    notes: Free tier only.
    usage:
      github: { account: acme, token: GH_ACME }
      resend: { token: RESEND_ACME }
    monitors:
      - id: site
        name: Website
        url: https://acme.example
        keyword: Acme
      - id: api
        name: API health
        url: https://acme.example/api/health
        keyword: '"ok":true'
      - id: short
        name: Short link
        url: https://acme.example/go
        expect: [200, 301]

  - id: beta
    name: Beta Foods
    status: unconfirmed
    platforms: [vercel, supabase]
    github: [beta/beta-app]

<html lang="en">
<head>

<title>free-tier-maxer · twoseats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='7' width='14' height='2' rx='1' fill='%23b9b6ae'/%3E%3Crect x='1' y='7' width='6' height='2' rx='1' fill='%230ca30c'/%3E%3C/svg%3E">
<style>
  :root {
    --surface: #fcfcfb; --surface-2: #f1f0ec; --ink: #1b1f24; --ink-2: #5a6069; --ink-3: #8a9099;
    --rule: #dcdad4; --track: #e6e4de; --time: #b9b6ae; --accent: #2f5fb3;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --unavail: #c9c6bf; --spark: #8a9099;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --surface-2: #222220; --ink: #ecebe6; --ink-2: #a9a8a1; --ink-3: #7b7a74;
      --rule: #34332f; --track: #2d2c29; --time: #5c5b55; --accent: #7fa3e6; --unavail: #3b3a36; --spark: #7b7a74;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--surface); color: var(--ink); }
  body {
    margin: 0; font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 48px 28px 96px; }
  a { color: var(--accent); }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; }
  header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  header .when { color: var(--ink-2); }
  nav.pages { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  nav.pages a { padding: 4px 12px; border: 1px solid var(--rule); border-radius: 99px; color: var(--ink-2); text-decoration: none; font-size: 13px; }
  nav.pages a[aria-current] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .snark { margin: 18px 0 0; font-size: 20px; line-height: 1.35; max-width: 42ch; }
  .snark b { font-weight: 600; }

  section { margin-top: 56px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 14px; letter-spacing: 0.02em; }
  .provider-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-top: 18px; border-top: 1px solid var(--rule); }
  .provider-head h2 { font-size: 20px; color: var(--ink); margin: 0; letter-spacing: -0.01em; }
  .provider-head .meta { color: var(--ink-2); }
  .provider-head .tag { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--rule); color: var(--ink-2); }
  .provider-head .tag.dashboard { border-color: var(--serious); color: var(--ink); }
  .provider-head .refresh { margin-left: auto; font-size: 13px; background: none; border: 1px solid var(--rule); color: var(--ink); padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
  .provider-head .refresh:hover { border-color: var(--ink-3); }
  .provider-head .refresh:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .rows { margin-top: 14px; }
  .row { display: grid; grid-template-columns: minmax(170px, 1.3fr) 96px minmax(200px, 1.8fr) minmax(170px, 1.1fr); gap: 0 18px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row .name { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .row .name .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .name .conf { font-size: 11px; color: var(--ink-3); }
  .spark { height: 20px; width: 96px; display: block; }
  .spark path { fill: none; stroke: var(--spark); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .spark rect { fill: var(--spark); }
  .spark .today { fill: var(--ink); }
  .spark.empty { opacity: .35; }
  .row .bars { display: grid; gap: 4px; }
  .bar { position: relative; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
  .bar.time > i { background: var(--time); }
  .bar.use > i { background: var(--good); }
  .row.warning .bar.use > i { background: var(--warning); }
  .row.serious .bar.use > i { background: var(--serious); }
  .row.critical .bar.use > i { background: var(--critical); }
  .row.unavailable .bar.use { background: repeating-linear-gradient(135deg, var(--unavail) 0 3px, transparent 3px 6px); }
  .row .nums { display: flex; justify-content: space-between; gap: 10px; white-space: nowrap; }
  .row .nums .pct { font-weight: 600; min-width: 4ch; text-align: right; }
  .row .nums .pct.unavail { color: var(--ink-3); font-weight: 400; }
  .row .nums .v { color: var(--ink-2); }
  .row .detail { grid-column: 1 / -1; display: none; padding: 10px 0 6px; cursor: default; }
  .row.open .detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 34ch); gap: 8px 28px; align-items: start; }
  .row .proj { color: var(--ink-2); font-size: 13px; }
  .row .proj b { color: var(--ink); }
  .chart { width: 100%; height: 110px; display: block; }
  .chart .grid { stroke: var(--rule); stroke-width: 1; }
  .chart .limit { stroke: var(--critical); stroke-width: 1; stroke-dasharray: 2 3; }
  .chart .actual { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .fill { fill: var(--ink); opacity: .07; }
  .chart .projection { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .chart .axis { fill: var(--ink-3); font-size: 10px; }
  .chart .cross { stroke: var(--ink-3); stroke-width: 1; display: none; }
  .chart .dot { fill: var(--ink); stroke: var(--surface); stroke-width: 2; display: none; }
  .chart .tip { fill: var(--ink); font-size: 11px; display: none; }
  .chart:hover .cross, .chart:hover .dot, .chart:hover .tip { display: block; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .chart-legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--ink); vertical-align: middle; margin-right: 6px; }
  .chart-legend i.p { border-top: 2px dashed var(--ink-3); }
  .chart-legend i.l { border-top: 1px dashed var(--critical); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13px; margin-top: 10px; }
  .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

  .runway .row { grid-template-columns: minmax(190px, 1.5fr) 96px minmax(200px, 1.8fr) minmax(190px, 1.2fr); }
  .runway .who { color: var(--ink-2); font-size: 13px; }
  .runway .eta { white-space: nowrap; }
  .runway .eta b { font-weight: 600; }
  .runway .eta.breach { color: var(--critical); }
  .status-word { font-size: 12px; color: var(--ink-2); }

  .notes { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 13px; max-width: 72ch; }
  .notes p { margin: 6px 0; }

  dialog { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 56ch; padding: 20px 22px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 8px; font-size: 16px; }
  dialog p { margin: 8px 0; color: var(--ink-2); }
  dialog code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  dialog button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface-2); color: var(--ink); cursor: pointer; }
  dialog button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  @media (max-width: 720px) {
    main { padding: 32px 18px 72px; }
    .row, .runway .row { grid-template-columns: 1fr 96px; gap: 6px 12px; }
    .row .bars, .row .nums, .runway .eta { grid-column: 1 / -1; }
    .row.open .detail { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .bar > i { transition: width .5s ease-out; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">free tiers</h1>
    <span class="when" id="when"></span>
  </header>
  <nav class="pages"><a href="/" aria-current="page">Overview</a><a href="/clients">By client</a><a href="/platforms">By platform</a><a href="/activity">Activity</a><a href="/classic">7-day table</a></nav>
  <p class="snark" id="snark"></p>

  <section class="runway">
    <h2>What runs out first</h2>
    <div class="rows" id="runway"></div>
    <div class="legend">
      <span><i style="background:var(--good)"></i>used, share of limit</span>
      <span><i style="background:var(--time)"></i>time elapsed, share of period</span>
      <span>Sparkline: daily usage, last 30 days. Click a row for the chart and projection.</span>
    </div>
  </section>

  <div id="providers"></div>

  <div class="notes" id="notes"></div>
</main>

<script>
const main = () => {
  const D = window.FTM_DATA, SERIES = window.FTM_SERIES || [];
  const now = new Date(D.generatedAt);
  const $ = (s, el = document) => el.querySelector(s);
  $('#title').textContent = `${D.project}, free tiers`; document.title = `${D.project}, free tiers`;
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const svg = (tag, attrs = {}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };

  const fmt = {
    bytes: (b) => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : b >= 1e3 ? (b / 1e3).toFixed(0) + ' KB' : Math.round(b) + ' B',
    count: (n) => n >= 1e6 ? (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : Math.round(n).toLocaleString('en'),
    ms: (ms) => { const h = Math.floor(ms / 3.6e6), m = Math.round((ms % 3.6e6) / 6e4); return h ? `${h}h ${m}m` : `${m} min`; },
    minutes: (m) => Math.round(m).toLocaleString('en') + ' min',
    gbh: (x) => x.toFixed(1) + ' GB-h',
    gbms: (x) => (x / 3.6e6).toFixed(1) + ' GB-h',
    mb: (x) => x >= 1000 ? (x / 1000).toFixed(1) + ' GB' : x.toFixed(0) + ' MB',
  };
  const days = (ms) => ms / 864e5;
  const dayWord = (n) => n < 1 ? 'today' : n < 1.5 ? 'tomorrow' : `in ${Math.round(n)} days`;
  const dstr = (d) => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const isoDay = (d) => d.toISOString().slice(0, 10);

  // ----- series lookup: provider/metric -> Map(date -> value), kind
  const SX = {};
  for (const s of SERIES) { const k = `${s.provider}/${s.metric}`; (SX[k] ??= { kind: s.kind, map: new Map() }).map.set(s.date, (SX[k].map.get(s.date) ?? 0) + s.value); }
  const seriesFor = (p, m) => SX[`${p.id}/${m.key}`] ?? null;

  const derive = (p, m) => {
    const per = m.period ?? p.period;
    const start = new Date(per.start), end = new Date(per.end);
    const elapsed = Math.max(0, now - start), total = end - start;
    const timePct = Math.min(1, elapsed / total);
    const pct = m.limit ? m.used / m.limit : null;
    const level = pct == null ? 'none' : pct >= 0.9 ? 'critical' : pct >= 0.7 ? 'serious' : pct >= 0.5 ? 'warning' : 'good';
    // period-average projection
    let projected = null, breachIn = null, projPct = null, rate7 = null, projected7 = null, breachIn7 = null;
    if (m.limit && m.resets && elapsed > 0 && m.used > 0) {
      const rate = m.used / elapsed;
      projected = rate * total; projPct = projected / m.limit;
      const toLimit = (m.limit - m.used) / rate;
      if (now.getTime() + toLimit < end.getTime()) breachIn = days(toLimit);
    }
    // trailing 7-day rate from the series, if present
    const sx = seriesFor(p, m);
    if (sx && sx.kind === 'delta' && m.resets && m.limit) {
      let sum = 0, n = 0;
      for (let i = 1; i <= 7; i++) { const d = new Date(now); d.setUTCDate(d.getUTCDate() - i); const v = sx.map.get(isoDay(d)); if (v != null) { sum += v; n++; } }
      if (n >= 3) {
        rate7 = sum / n; // per day
        projected7 = m.used + rate7 * days(end - now);
        if (rate7 > 0) { const dl = (m.limit - m.used) / rate7; if (dl < days(end - now)) breachIn7 = dl; }
      }
    }
    // sizes: growth trend over the available history (first vs last point, up to 30 days)
    let growth = null, fullIn = null, growthDays = null;
    if (sx && sx.kind === 'level' && m.limit) {
      const pts = [...sx.map.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
      if (pts.length >= 7) {
        const [d0, v0] = pts[0], [d1, v1] = pts.at(-1);
        growthDays = days(new Date(d1) - new Date(d0));
        if (growthDays > 0) { growth = (v1 - v0) / growthDays; if (growth > 0) fullIn = (m.limit - m.used) / growth; }
      }
    }
    return { start, end, timePct, pct, level, projected, projPct, breachIn: breachIn ?? (fullIn != null && fullIn < 365 ? fullIn : null), daysLeft: days(end - now), rate7, projected7, breachIn7, growth, growthDays, fullIn };
  };

  // ----- sparkline: last 30 days of daily values (bars), today highlighted
  const sparkline = (p, m) => {
    const sx = seriesFor(p, m);
    const W = 96, H = 20, N = 30;
    const s = svg('svg', { class: 'spark' + (sx ? '' : ' empty'), viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' });
    if (!sx) { s.append(svg('path', { d: `M0 ${H - 1} H${W}` })); return s; }
    const vals = []; for (let i = N - 1; i >= 0; i--) { const d = new Date(now); d.setUTCDate(d.getUTCDate() - i); vals.push(sx.map.get(isoDay(d)) ?? 0); }
    const max = Math.max(1e-9, ...vals);
    if (sx.kind === 'level') {
      // sizes: plot the trend between min and max so growth is visible; skip days without a reading
      const known = vals.map((v, i) => [i, sx.map.has(isoDay(new Date(now.getTime() - (N - 1 - i) * 864e5))) ? v : null]).filter((x) => x[1] != null);
      const lo = Math.min(...known.map((x) => x[1])), hi = Math.max(...known.map((x) => x[1]));
      const span = Math.max(hi - lo, hi * 0.02, 1e-9);
      const pts = known.map(([i, v]) => `${(i / (N - 1) * (W - 2) + 1).toFixed(1)} ${(H - 2 - (v - lo) / span * (H - 4)).toFixed(1)}`);
      s.append(svg('path', { d: 'M' + pts.join(' L') }));
    } else {
      const bw = W / N;
      vals.forEach((v, i) => { const h = Math.max(v > 0 ? 1.5 : 0, v / max * (H - 2)); s.append(svg('rect', { x: (i * bw + 0.5).toFixed(1), y: (H - h).toFixed(1), width: (bw - 1).toFixed(1), height: h.toFixed(1), class: i === N - 1 ? 'today' : '' })); });
    }
    return s;
  };

  // ----- period chart: cumulative actual, limit, projections, hover
  const chart = (p, m, d) => {
    const sx = seriesFor(p, m);
    const f = fmt[m.unit];
    const W = 600, H = 110, L = 8, R = 8, T = 10, B = 18;
    const s = svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img' });
    const isLevel = sx?.kind === 'level';
    // quotas: window = billing period. sizes: window = 30 days of history + 30 days of trend ahead
    const winStart = isLevel ? new Date(now.getTime() - 30 * 864e5) : d.start;
    const winEnd = isLevel ? new Date(now.getTime() + 30 * 864e5) : d.end;
    const totalDays = Math.max(1, Math.round(days(winEnd - winStart)));
    const x = (dayIdx) => L + dayIdx / totalDays * (W - L - R);
    // build cumulative (or level) points from window start to today
    const pts = []; let cum = 0;
    const todayIdx = Math.floor(days(now - winStart));
    if (sx) {
      for (let i = 0; i <= todayIdx; i++) { const dd = new Date(winStart); dd.setUTCDate(dd.getUTCDate() + i); const v = sx.map.get(isoDay(dd)); if (isLevel) { if (v != null) pts.push({ i, v, date: dd }); } else { cum += v ?? 0; pts.push({ i, v: cum, date: dd }); } }
    }
    const endVal = isLevel ? (d.growth != null ? m.used + Math.max(0, d.growth) * 30 : m.used) : m.resets ? (d.projected7 ?? d.projected ?? m.used) : m.used;
    const dataMax = Math.max(m.used, endVal, ...pts.map((q) => q.v), 1e-9);
    // Scale to the limit when usage is a meaningful share of it; otherwise scale to the data and say how far away the limit is.
    const limitInView = m.limit != null && dataMax >= m.limit * 0.1;
    const yMax = (limitInView ? Math.max(m.limit, dataMax) : dataMax) * 1.08;
    const y = (v) => T + (1 - v / yMax) * (H - T - B);
    // grid + axis
    s.append(svg('line', { class: 'grid', x1: L, x2: W - R, y1: y(0), y2: y(0) }));
    const ts = svg('text', { class: 'axis', x: L, y: H - 4 }); ts.textContent = dstr(winStart); s.append(ts);
    const te = svg('text', { class: 'axis', x: W - R, y: H - 4, 'text-anchor': 'end' }); te.textContent = isLevel ? `${dstr(winEnd)}, if the trend holds` : m.resets ? `resets ${dstr(d.end)}` : dstr(now); s.append(te);
    if (isLevel) { s.append(svg('line', { class: 'grid', x1: x(todayIdx), x2: x(todayIdx), y1: T, y2: H - B })); const tt = svg('text', { class: 'axis', x: x(todayIdx) + 4, y: H - 4 }); tt.textContent = 'today'; s.append(tt); }
    if (limitInView) { s.append(svg('line', { class: 'limit', x1: L, x2: W - R, y1: y(m.limit), y2: y(m.limit) })); const tl = svg('text', { class: 'axis', x: W - R, y: y(m.limit) - 3, 'text-anchor': 'end' }); tl.textContent = `limit ${f(m.limit)}`; s.append(tl); }
    else if (m.limit) { const tl = svg('text', { class: 'axis', x: L, y: T + 4, 'text-anchor': 'start' }); const mult = m.limit / dataMax; tl.textContent = `limit ${f(m.limit)} is ${mult >= 100 ? Math.round(mult / 10) * 10 : Math.round(mult)}× above this chart`; s.append(tl); }
    if (pts.length) {
      const path = 'M' + pts.map((q) => `${x(q.i).toFixed(1)} ${y(q.v).toFixed(1)}`).join(' L');
      if (sx.kind !== 'level') s.append(svg('path', { class: 'fill', d: path + ` L${x(pts.at(-1).i).toFixed(1)} ${y(0)} L${x(pts[0].i).toFixed(1)} ${y(0)} Z` }));
      s.append(svg('path', { class: 'actual', d: path }));
      const last = pts.at(-1);
      if (m.resets && m.limit && last.v > 0 && !isLevel && d.projected7 != null) s.append(svg('path', { class: 'projection', d: `M${x(last.i).toFixed(1)} ${y(last.v).toFixed(1)} L${x(totalDays).toFixed(1)} ${y(Math.min(yMax, d.projected7)).toFixed(1)}` }));
      if (isLevel && d.growth != null) s.append(svg('path', { class: 'projection', d: `M${x(last.i).toFixed(1)} ${y(last.v).toFixed(1)} L${x(totalDays).toFixed(1)} ${y(Math.min(yMax, endVal)).toFixed(1)}` }));
    } else {
      // no series: draw the single known point
      s.append(svg('circle', { cx: x(todayIdx), cy: y(m.used), r: 3, fill: 'var(--ink)' }));
    }
    // hover layer
    const cross = svg('line', { class: 'cross', y1: T, y2: H - B }); const dot = svg('circle', { class: 'dot', r: 4 }); const tip = svg('text', { class: 'tip', y: T + 10 });
    s.append(cross, dot, tip);
    s.addEventListener('mousemove', (ev) => {
      if (!pts.length) return;
      const r = s.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width * W;
      let best = pts[0]; for (const q of pts) if (Math.abs(x(q.i) - px) < Math.abs(x(best.i) - px)) best = q;
      cross.setAttribute('x1', x(best.i)); cross.setAttribute('x2', x(best.i)); dot.setAttribute('cx', x(best.i)); dot.setAttribute('cy', y(best.v));
      const daily = sx.map.get(isoDay(best.date)) ?? 0;
      tip.textContent = sx.kind === 'level' ? `${dstr(best.date)}: ${f(best.v)}` : `${dstr(best.date)}: ${f(best.v)} so far, +${f(daily)} that day`;
      const anchorEnd = x(best.i) > W * 0.6; tip.setAttribute('x', x(best.i) + (anchorEnd ? -8 : 8)); tip.setAttribute('text-anchor', anchorEnd ? 'end' : 'start');
    });
    return s;
  };

  // ----- header
  $('#when').textContent = `snapshot ${now.toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}`;

  const all = [];
  D.providers.forEach((p) => p.metrics.forEach((m) => all.push({ p, m, d: derive(p, m) })));

  const row = ({ p, m, d }, { runway = false } = {}) => {
    const r = el('div', `row ${d.level}` + (m.limit == null ? ' unavailable' : ''));
    r.tabIndex = 0;
    const name = el('div', 'name');
    name.append(el('span', 'label', m.label + (runway ? ` <span class="who">· ${p.name}</span>` : '')));
    if (m.confidence) name.append(el('span', 'conf', m.confidence));
    const bars = el('div', 'bars');
    const use = el('div', 'bar use'); use.append(el('i')); const ub = use.firstChild;
    const time = el('div', 'bar time'); time.append(el('i')); const tb = time.firstChild;
    bars.append(use, m.resets ? time : el('div'));
    const nums = el('div', 'nums');
    const f = fmt[m.unit];
    if (m.used == null) {
      r.classList.add('unavailable');
      nums.append(el('span', 'v', 'unavailable'), el('span', 'pct unavail', ''));
      const detail = el('div', 'detail'); detail.append(el('div', 'proj', (m.unavailable || 'Not reported by this route') + '.'));
      r.append(name, sparkline(p, m), bars, nums, detail);
      r.addEventListener('click', () => r.classList.toggle('open'));
      return r;
    }
    if (m.limit == null) nums.append(el('span', 'v', f(m.used)), el('span', 'pct unavail', 'no cap'));
    else nums.append(el('span', 'v', `${f(m.used)} <span style="color:var(--ink-3)">of</span> ${f(m.limit)}`), el('span', 'pct', Math.round(d.pct * 100) + '%'));

    const detail = el('div', 'detail');
    const proj = el('div', 'proj');
    const parts = [];
    if (m.limit != null) parts.push(d.level === 'good' ? 'Fine.' : d.level === 'warning' ? 'Keep an eye on it.' : d.level === 'serious' ? 'Getting close.' : 'At the limit.');
    if (m.resets) {
      parts.push(`Resets ${dstr(d.end)} (${dayWord(d.daysLeft)}, ${Math.round(d.timePct * 100)}% of the period gone).`);
      if (d.rate7 != null) {
        parts.push(`Last 7 days: ${f(d.rate7)} a day. At that pace you end the period at <b>${f(d.projected7)}</b>${m.limit ? ` (${Math.round(d.projected7 / m.limit * 100)}% of the limit)` : ''}.`);
        if (d.breachIn7 != null) parts.push(`<b>Projected to hit the limit ${dayWord(d.breachIn7)}.</b>`);
        if (d.projected != null && Math.abs(d.projected - d.projected7) / Math.max(1, d.projected) > 0.25) parts.push(`The period average says ${f(d.projected)}; recent days are ${d.projected7 > d.projected ? 'busier' : 'quieter'}.`);
      } else if (d.projected != null) {
        parts.push(`At the period's average pace you end at ${f(d.projected)}${m.limit ? ` (${Math.round(d.projPct * 100)}% of the limit)` : ''}.`);
        if (d.breachIn != null) parts.push(`<b>Projected to hit the limit ${dayWord(d.breachIn)}.</b>`);
      }
    } else {
      parts.push('Does not reset: this is a size, not a monthly quota.');
      if (d.growth != null) {
        const grew = d.growth * d.growthDays;
        parts.push(`Grew ${f(Math.abs(grew))} over the last ${Math.round(d.growthDays)} days (${f(Math.abs(d.growth))} a day).`);
        if (d.fullIn != null) { const when = new Date(now.getTime() + d.fullIn * 864e5); parts.push(d.fullIn < 365 ? `<b>At that pace it fills up ${dayWord(d.fullIn)}</b> (${when.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}).` : `At that pace it takes about ${(d.fullIn / 365).toFixed(1)} years to fill.`); }
        else parts.push('Not growing right now.');
      }
    }
    if (m.note) parts.push(m.note + '.');
    const sx = seriesFor(p, m);
    parts.push(`Source: ${p.source === 'official' ? 'official API' : 'dashboard session'}${sx ? `, daily history ${sx.map.size} days${p.source === 'official' ? ' from the API' : ' from the dashboard'}` : ', no daily history yet'}.`);
    proj.innerHTML = parts.join(' ');
    const chartWrap = el('div');
    let built = false;
    const build = () => { if (built) return; built = true; chartWrap.append(chart(p, m, d)); const lg = el('div', 'chart-legend'); lg.innerHTML = `<span><i></i>${sx?.kind === 'level' ? 'size' : 'used so far'}</span>` + (sx?.kind === 'level' && d.growth != null ? `<span><i class="p"></i>trend of the last ${Math.round(d.growthDays)} days, carried 30 days ahead</span>` : m.resets && m.limit ? `<span><i class="p"></i>projection, last-7-day pace</span>` : '') + (m.limit && Math.max(m.used, d.projected7 ?? d.projected ?? 0) >= m.limit * 0.1 ? `<span><i class="l"></i>limit</span>` : ''); chartWrap.append(lg); };
    detail.append(chartWrap, proj);
    detail.addEventListener('click', (e) => e.stopPropagation());

    r.append(name, sparkline(p, m), bars, nums, detail);
    if (runway) {
      const eta = el('div', 'eta' + ((d.breachIn7 ?? d.breachIn) != null ? ' breach' : ''));
      const bi = d.breachIn7 ?? d.breachIn, pp = d.projected7 != null ? d.projected7 / m.limit : d.projPct;
      eta.innerHTML = !m.resets && d.fullIn != null ? (d.fullIn < 365 ? `<b>full ${dayWord(d.fullIn)}</b>` : `full in <b>${(d.fullIn / 365).toFixed(1)} yrs</b>`) : bi != null ? `<b>limit ${dayWord(bi)}</b>` : pp != null ? `ends at <b>${Math.round(pp * 100)}%</b>` : m.resets ? 'no usage yet' : 'no reset';
      nums.replaceWith(eta);
      eta.prepend(el('span', 'pct', m.limit ? Math.round(d.pct * 100) + '%' : ''), ' ');
    }
    const toggle = () => { r.classList.toggle('open'); if (r.classList.contains('open')) build(); };
    r.addEventListener('click', toggle);
    r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    requestAnimationFrame(() => { ub.style.width = (m.limit ? Math.min(100, d.pct * 100) : 0) + '%'; tb.style.width = (d.timePct * 100) + '%'; });
    return r;
  };

  // ----- runway
  const ranked = all.filter((x) => x.m.limit != null && x.m.used != null).sort((a, b) => {
    const ka = a.d.breachIn7 ?? a.d.breachIn ?? Infinity, kb = b.d.breachIn7 ?? b.d.breachIn ?? Infinity;
    if (ka !== kb) return ka - kb;
    const pa = a.d.projected7 != null ? a.d.projected7 / a.m.limit : (a.d.projPct ?? a.d.pct), pb = b.d.projected7 != null ? b.d.projected7 / b.m.limit : (b.d.projPct ?? b.d.pct);
    return pb - pa;
  }).slice(0, 7);
  const rw = $('#runway'); ranked.forEach((x) => rw.append(row(x, { runway: true })));

  // ----- snark
  const top = ranked[0];
  if (top) {
  const topPct = top.d.projected7 != null ? top.d.projected7 / top.m.limit : top.d.projPct;
  const bi = top.d.breachIn7 ?? top.d.breachIn;
  const lines = {
        breach: (x) => `<b>${x.p.name} ${x.m.label.toLowerCase()}</b> is projected to hit its limit ${dayWord(bi)}.`,
        serious: (x) => `<b>${x.p.name} ${x.m.label.toLowerCase()}</b> is at ${Math.round(x.d.pct * 100)}% of its limit.`,
        calm: (x) => `Everything fits. Closest to its limit: <b>${x.p.name} ${x.m.label.toLowerCase()}</b>, on track to end the period at ${Math.round(topPct * 100)}%.`,
  };
  $('#snark').innerHTML = bi != null ? lines.breach(top) : top.d.pct >= 0.7 ? lines.serious(top) : lines.calm(top);
  } else $('#snark').textContent = D.providers.length ? 'Nothing here has a limit to run out of.' : 'No readings yet. The collector runs hourly; check back after the next run.';

  // ----- providers
  const host = $('#providers');
  D.providers.forEach((p) => {
    const s = el('section');
    const head = el('div', 'provider-head');
    head.append(el('h2', null, p.name), el('span', 'meta', `${p.plan} · ${p.account}`));
    head.append(el('span', 'tag ' + p.source, p.source === 'official' ? 'official API' : 'dashboard session'));
    if (p.metrics[0]) { const d0 = derive(p, p.metrics[0]); head.append(el('span', 'meta', `period ends ${dstr(d0.end)}${p.period.anchor === 'assumed' ? ', assumed' : ''}`)); }
    if (p.status) head.append(el('span', 'status-word', `${p.status.label}: ${p.status.value.toLowerCase().replace('_', ', ')}`));
    const rows = el('div', 'rows');
    p.metrics.forEach((m) => rows.append(row({ p, m, d: derive(p, m) })));
    s.append(head, rows); host.append(s);
  });

  // ----- notes
  $('#notes').innerHTML = `
    <p>Read-only API tokens, checked hourly. Alerts at 50, 80 and 95% of each limit go to Telegram; this page is the overview.</p>
    <p>Projections use the last seven days' pace when history exists, the period average otherwise. Sizes (database, storage) do not reset and are not projected. Vercel bandwidth and Supabase egress are not available to API tokens on free plans.</p>
    <p>Snapshot ${now.toLocaleDateString('en-GB', { dateStyle: 'long' })}. Page adapted from free-tier-maxxer (MIT).</p>`;
};
// The Worker serves /data.js and /series.js from D1 (usage/src/ledger.ts).
const loadScript = (src) => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.append(s); });
loadScript('data.js').then(() => loadScript('series.js').catch(() => {}))
  .then(main)
  .catch((e) => { document.getElementById('snark').textContent = 'Could not load the readings. ' + e; });
</script>
</body>
</html>

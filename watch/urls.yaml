# Free-tier terms watch — run daily by .github/workflows/freetier-watch.yml with urlwatch (https://github.com/thp/urlwatch).
# Any addition, change or deletion on these pages is posted to Telegram as a diff.
#
# Cloudflare: the docs are open source, so we watch the Markdown SOURCE (exact line diffs, no page chrome). The numbers
# often live in "partials" that a page pulls in with <Render file="x" product="y"/> → src/content/partials/y/x.mdx, so
# both the page and its pricing partials are listed. A NEW partial shows up as an added <Render> line on its page.
# Other platforms publish HTML only: we watch the page's main content as text.
#
# After a change: check usage/src/limits.ts (FREE_PLAN_LIMITS) and clients' notes, then update and redeploy.
